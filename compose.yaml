services:
  pipeline:
    build: .
    command: ["status"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
  dashboard:
    build: .
    entrypoint: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["127.0.0.1:8501:8501"]
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
